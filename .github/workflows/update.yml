name: Weekly Trial Updater

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update-trials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DB_PATH: trials.db
          OUTPUT_PATH: public/trials_cache.json
          DIGEST_PATH: public/update_digest.json
        run: python backend/updater.py

      - name: Commit updated cache
        run: |
          git config user.name "TrialNavigator Bot"
          git config user.email "bot@trialnavigator"
          git add public/trials_cache.json public/update_digest.json
          git diff --staged --quiet || git commit -m "chore: weekly trial data update $(date +%Y-%m-%d)"
          git push
